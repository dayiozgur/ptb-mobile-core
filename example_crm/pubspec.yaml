name: protoolbag_crm
description: CRM (Protoolbag Satış) - saha satış self-service uygulaması, Protoolbag Core üzerine kurulu.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Paylaşılan çekirdek (tüm dinamik motorlar + nötr shell)
  protoolbag_core:
    path: ../

  # Supabase (contacts özel modülü doğrudan SupabaseClient kullanır)
  supabase_flutter: ^2.5.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Date formatting
  intl: ^0.19.0
  # NOT: url_launcher / google_mlkit_text_recognition / image_picker
  # protoolbag_core'a taşındı (UrlActions + CardScanner çekirdek capability).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  characters: any
flutter:
  uses-material-design: true

  assets:
    - .env
