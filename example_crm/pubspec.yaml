name: protoolbag_crm
description: CRM (Protoolbag Satış) - saha satış self-service uygulaması, Protoolbag Core üzerine kurulu.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Paylaşılan çekirdek (tüm dinamik motorlar + nötr shell)
  protoolbag_core:
    path: ../

  # Supabase (contacts özel modülü doğrudan SupabaseClient kullanır)
  supabase_flutter: ^2.5.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Date formatting
  intl: ^0.19.0

  # tel: / mailto: hızlı aksiyonlar
  url_launcher: ^6.3.0

  # Kartvizit tarama — on-device OCR (bulut/anahtar YOK) + kamera yakalama
  google_mlkit_text_recognition: ^0.13.1
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
